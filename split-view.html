<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plato's Shell — Split View (Agent + Human)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', Courier, monospace;
  }

  /* Top bar */
  #top-bar {
    height: 32px;
    background: #0a0a0a;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-shrink: 0;
  }

  #top-bar .title {
    color: #c8a050;
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: bold;
  }

  #top-bar .room-display {
    color: #888;
    font-size: 11px;
  }

  #top-bar .room-display .room-name {
    color: #e8b840;
    font-weight: bold;
  }

  #sync-status {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #00ff41;
    font-size: 10px;
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff41;
    animation: syncPulse 2s infinite;
  }

  @keyframes syncPulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px #00ff41; }
    50% { opacity: 0.4; box-shadow: none; }
  }

  /* Split container */
  #split-container {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* Left side — MUD Terminal */
  #mud-side {
    width: 45%;
    background: #000;
    border-right: 2px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #mud-side .side-label {
    padding: 4px 12px;
    background: #001100;
    border-bottom: 1px solid #0a3a1a;
    color: #00aa2a;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  #mud-terminal-frame {
    flex: 1;
    border: none;
    width: 100%;
  }

  /* Right side — ScummVM */
  #scumm-side {
    width: 55%;
    background: #0a0700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  #scumm-side .side-label {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 4px 12px;
    background: rgba(10, 7, 0, 0.85);
    border-bottom: 1px solid #4a3520;
    color: #8a6a30;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 50;
  }

  #scumm-frame-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #scumm-frame {
    width: 100%;
    max-width: 960px;
    max-height: 100%;
    aspect-ratio: 320/200;
    border: none;
    image-rendering: pixelated;
  }

  /* Divider with door icon */
  #divider-door {
    width: 2px;
    background: linear-gradient(180deg,
      transparent 0%,
      #4a3520 10%,
      #c8a050 50%,
      #4a3520 90%,
      transparent 100%
    );
    position: relative;
    flex-shrink: 0;
  }

  #divider-door::after {
    content: '◆';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #e8b840;
    font-size: 16px;
    text-shadow: 0 0 8px rgba(232, 184, 64, 0.4);
    background: #000;
    padding: 4px 2px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    #split-container {
      flex-direction: column;
    }
    #mud-side {
      width: 100%;
      height: 45%;
      border-right: none;
      border-bottom: 2px solid #2a2a2a;
    }
    #scumm-side {
      width: 100%;
      height: 55%;
    }
    #divider-door {
      display: none;
    }
  }
</style>
</head>
<body>

<div id="top-bar">
  <span class="title">◆ PLATO'S SHELL — SPLIT VIEW ◆</span>
  <span class="room-display">Room: <span class="room-name" id="current-room-display">The Tap — Bar Rail</span></span>
  <span id="sync-status"><span class="sync-dot"></span> SYNCED</span>
</div>

<div id="split-container">
  <!-- LEFT: Agent View (MUD Terminal) -->
  <div id="mud-side">
    <div class="side-label">◀ AGENT VIEW — TEXT INTERFACE</div>
    <iframe id="mud-terminal-frame" src="mud-terminal.html"></iframe>
  </div>

  <!-- DIVIDER: The Door Between Caves -->
  <div id="divider-door"></div>

  <!-- RIGHT: Human View (ScummVM) -->
  <div id="scumm-side">
    <div class="side-label">HUMAN VIEW — VISUAL SCENE ▶</div>
    <div id="scumm-frame-container">
      <iframe id="scumm-frame" src="index.html"></iframe>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// PLATO'S SHELL — SPLIT VIEW SYNCHRONIZER
// The door between the caves. Keeps both views in sync.
// ════════════════════════════════════════════════════════════

const WORLD_KEY = 'platos-shell-world';
const ROOM_DISPLAY = document.getElementById('current-room-display');

const ROOM_NAMES = {
  'bar-rail': 'The Tap — Bar Rail',
  'aft-deck': 'The Aft Deck',
  'wheelhouse': 'The Wheelhouse',
  'galley': 'The Galley',
  'engine-room': 'The Engine Room'
};

// Map MUD room IDs to ScummVM room IDs
const ROOM_ID_MAP = {
  'bar-rail': 'bar-rail',
  'aft-deck': 'aft-deck',
  'wheelhouse': 'wheelhouse',
  'galley': 'galley',
  'engine-room': 'aft-deck' // engine room not in scummvm yet, fallback
};

// ── World State Bridge ──
function getWorldState() {
  try {
    const s = localStorage.getItem(WORLD_KEY);
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { currentRoom: 'bar-rail', inventory: [] };
}

function updateRoomDisplay() {
  const state = getWorldState();
  ROOM_DISPLAY.textContent = ROOM_NAMES[state.currentRoom] || state.currentRoom;
}

// ── Cross-frame sync via storage events ──
window.addEventListener('storage', (e) => {
  if (e.key === WORLD_KEY) {
    updateRoomDisplay();
    syncScummFrame();
  }
});

// ── Custom event from MUD terminal (same window) ──
window.addEventListener('world-update', (e) => {
  updateRoomDisplay();
  syncScummFrame();
});

// ── Sync ScummVM iframe to match MUD room ──
function syncScummFrame() {
  const state = getWorldState();
  const scummFrame = document.getElementById('scumm-frame');

  try {
    const scummWindow = scummFrame.contentWindow;
    if (scummWindow && scummWindow.currentRoom !== undefined) {
      // If ScummVM room differs, trigger transition
      const targetRoom = ROOM_ID_MAP[state.currentRoom] || state.currentRoom;
      if (scummWindow.currentRoom !== targetRoom) {
        // Use the ScummVM's own transition function if available
        if (scummWindow.transitionToRoom && scummWindow.ROOMS && scummWindow.ROOMS[targetRoom]) {
          scummWindow.currentRoom = targetRoom;
          scummWindow.loadHotspots();
          scummWindow.updateLocationIndicator();
        }
      }

      // Sync inventory
      if (scummWindow.inventory !== undefined) {
        // Map MUD inventory items to ScummVM format
        const mapped = state.inventory.map(item => {
          if (item.id === 'life-ring' || item.id === 'life_ring') return { id: 'life_ring', name: 'Life Ring' };
          if (item.id === 'coffee') return { id: 'coffee', name: 'Coffee Mug' };
          return item;
        });
        scummWindow.inventory = mapped;
        if (scummWindow.updateInventoryBar) scummWindow.updateInventoryBar();
      }
    }
  } catch(e) {
    // Cross-origin or not ready yet
  }
}

// ── Listen for ScummVM room changes ──
function pollScummRoom() {
  const scummFrame = document.getElementById('scumm-frame');
  try {
    const scummWindow = scummFrame.contentWindow;
    if (scummWindow && scummWindow.currentRoom !== undefined) {
      const scummRoom = scummWindow.currentRoom;
      const state = getWorldState();
      const mappedMud = reverseMapRoom(scummRoom);
      if (mappedMud && state.currentRoom !== mappedMud) {
        // ScummVM changed, update MUD state
        state.currentRoom = mappedMud;
        try { localStorage.setItem(WORLD_KEY, JSON.stringify(state)); } catch(e) {}
        updateRoomDisplay();
        // Trigger re-render in MUD frame
        const mudFrame = document.getElementById('mud-terminal-frame');
        if (mudFrame.contentWindow) {
          mudFrame.contentWindow.dispatchEvent(new CustomEvent('world-update', { detail: state }));
        }
      }
    }
  } catch(e) {}
}

function reverseMapRoom(scummId) {
  const map = {
    'bar-rail': 'bar-rail',
    'aft-deck': 'aft-deck',
    'wheelhouse': 'wheelhouse',
    'galley': 'galley'
  };
  return map[scummId] || null;
}

// ── Initialize ──
window.addEventListener('load', () => {
  // Set initial world state
  let state = getWorldState();
  if (!state.currentRoom) {
    state = { currentRoom: 'bar-rail', inventory: [] };
    try { localStorage.setItem(WORLD_KEY, JSON.stringify(state)); } catch(e) {}
  }
  updateRoomDisplay();

  // Poll ScummVM frame for room changes (every 500ms)
  setInterval(pollScummRoom, 500);

  // Initial sync attempt after frames load
  setTimeout(() => {
    syncScummFrame();
  }, 2000);
});

// ── Keyboard shortcut: Tab to focus MUD input ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const mudFrame = document.getElementById('mud-terminal-frame');
    if (mudFrame.contentWindow) {
      mudFrame.contentWindow.document.getElementById('command-input')?.focus();
    }
  }
});
</script>

</body>
</html>
